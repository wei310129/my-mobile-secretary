name: Test gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  merge-policy-preflight:
    name: Merge policy preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      require-serial: ${{ steps.policy.outputs.require_serial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read changed files from GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const value = files.map(file => ({
              filename: file.filename,
              previous_filename: file.previous_filename || null,
              status: file.status
            }));
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'changed-files.json'), JSON.stringify(value));
      - name: Run merge policy self-test
        shell: pwsh
        run: |
          ./scripts/tests/merge-policy-test.ps1
          ./scripts/tests/merge-pr-test.ps1
      - name: Validate merge policy
        id: policy
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $result = ./scripts/merge-policy.ps1 `
            -BaseRef $env:BASE_REF `
            -HeadRef $env:HEAD_REF `
            -BaseSha $env:BASE_SHA `
            -HeadSha $env:HEAD_SHA `
            -ChangedFilesJson (Join-Path $env:RUNNER_TEMP 'changed-files.json') `
            -Json | ConvertFrom-Json
          "require_serial=$($result.requiresSerial.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $result | ConvertTo-Json -Compress

  pr-risk-serial-regression:
    name: PR risk serial regression
    needs: merge-policy-preflight
    if: needs.merge-policy-preflight.outputs.require-serial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run one-JVM risk regression
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Full -Ci
      - name: Upload risk serial reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-pr-risk-serial
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  merge-policy:
    name: Merge policy
    if: always() && github.event_name == 'pull_request'
    needs: [merge-policy-preflight, pr-risk-serial-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce merge policy and risk regression
        shell: pwsh
        env:
          PREFLIGHT_RESULT: ${{ needs.merge-policy-preflight.result }}
          SERIAL_REQUIRED: ${{ needs.merge-policy-preflight.outputs.require-serial }}
          SERIAL_RESULT: ${{ needs.pr-risk-serial-regression.result }}
        run: |
          if ($env:PREFLIGHT_RESULT -ne 'success') {
            throw "Merge policy preflight result: $env:PREFLIGHT_RESULT"
          }
          if ($env:SERIAL_REQUIRED -eq 'true' -and $env:SERIAL_RESULT -ne 'success') {
            throw "Required PR serial regression result: $env:SERIAL_RESULT"
          }
          if ($env:SERIAL_REQUIRED -ne 'true' -and $env:SERIAL_RESULT -notin @('skipped', 'success')) {
            throw "Unexpected optional PR serial regression result: $env:SERIAL_RESULT"
          }

  fast:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Inventory summary
        shell: pwsh
        run: ./scripts/test-inventory.ps1 -Mode Summary -ShardCount 3 -Json
      - name: Run fast lane
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Fast -Ci
      - name: Upload fast reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-fast
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run serial integration shard
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Integration -ShardCount 3 -ShardIndex ${{ matrix.shard }} -Ci
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-integration-${{ matrix.shard }}
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  automated-regression:
    name: Automated regression complete
    if: always()
    needs: [fast, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-*
          path: artifacts
      - name: Verify exact automated test coverage
        shell: pwsh
        run: ./scripts/test-inventory.ps1 -Mode VerifyReports -ReportRoots artifacts -Json
      - name: Enforce upstream job status
        if: needs.fast.result != 'success' || needs.integration.result != 'success'
        shell: pwsh
        run: throw 'Fast or integration test job failed.'

  main-serial-regression:
    name: Main serial regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run one-JVM automated regression
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Full -Ci
      - name: Upload serial reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-main-serial
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14
