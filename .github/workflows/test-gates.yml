name: Test gates

on:
  pull_request:
    # Draft PRs must enter the same required-check path when they become ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  merge-policy-preflight:
    name: Merge policy preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      require-serial: ${{ steps.policy.outputs.require_serial }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read changed files from GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const value = files.map(file => ({
              filename: file.filename,
              previous_filename: file.previous_filename || null,
              status: file.status
            }));
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'changed-files.json'), JSON.stringify(value));
      - name: Run merge policy self-test
        shell: pwsh
        run: |
          ./scripts/tests/merge-policy-test.ps1
          ./scripts/tests/merge-pr-test.ps1
      - name: Validate merge policy
        id: policy
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $result = ./scripts/merge-policy.ps1 `
            -BaseRef $env:BASE_REF `
            -HeadRef $env:HEAD_REF `
            -BaseSha $env:BASE_SHA `
            -HeadSha $env:HEAD_SHA `
            -ChangedFilesJson (Join-Path $env:RUNNER_TEMP 'changed-files.json') `
            -Json | ConvertFrom-Json
          "require_serial=$($result.requiresSerial.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $result | ConvertTo-Json -Compress
      - name: Validate producer request manifest
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $files = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'changed-files.json') -Raw -Encoding utf8 | ConvertFrom-Json
          $requests = @($files | Where-Object {
            $_.filename -match '^docs/exec-plans/active/handoffs/requests/[^/]+[.]json$' -and $_.status -ne 'removed'
          })
          if ($requests.Count -eq 0) {
            'No producer request manifest in this PR.'
            exit 0
          }
          if ($requests.Count -ne 1 -or [string]$requests[0].status -ne 'added') {
            throw 'A producer coordination PR must add exactly one request manifest.'
          }
          $trustedEngine = Join-Path $env:RUNNER_TEMP 'trusted-producer-handoff-request.ps1'
          $trustedPolicy = Join-Path $env:RUNNER_TEMP 'trusted-producer-handoff-request-policy.json'
          $engineContent = @(git show "$($env:BASE_SHA):scripts/producer-handoff.ps1")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to load trusted producer engine from the PR base.' }
          [IO.File]::WriteAllLines($trustedEngine, $engineContent, [Text.UTF8Encoding]::new($false))
          $policyContent = @(git show "$($env:BASE_SHA):.github/producer-handoff-policy.json")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to load trusted producer policy from the PR base.' }
          [IO.File]::WriteAllLines($trustedPolicy, $policyContent, [Text.UTF8Encoding]::new($false))
          & $trustedEngine -Mode ValidateRequest `
            -RequestPath ([string]$requests[0].filename) `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -PolicyPath $trustedPolicy `
            -Json
      - name: Validate producer handoff contract
        if: startsWith(github.head_ref, 'automation/producer-handoff/')
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $trustedEngine = Join-Path $env:RUNNER_TEMP 'trusted-producer-handoff.ps1'
          $trustedPolicy = Join-Path $env:RUNNER_TEMP 'trusted-producer-handoff-policy.json'
          $engineContent = @(git show "$($env:BASE_SHA):scripts/producer-handoff.ps1")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to load trusted producer engine from the PR base.' }
          [IO.File]::WriteAllLines($trustedEngine, $engineContent, [Text.UTF8Encoding]::new($false))
          $policyContent = @(git show "$($env:BASE_SHA):.github/producer-handoff-policy.json")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to load trusted producer policy from the PR base.' }
          [IO.File]::WriteAllLines($trustedPolicy, $policyContent, [Text.UTF8Encoding]::new($false))
          $files = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'changed-files.json') -Raw -Encoding utf8 | ConvertFrom-Json
          $receipts = @($files | Where-Object { $_.filename -like 'docs/exec-plans/active/handoffs/receipts/*.json' })
          if ($receipts.Count -ne 1) { throw "Expected exactly one producer receipt; found $($receipts.Count)." }
          $receiptPath = [string]$receipts[0].filename
          $receipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding utf8 | ConvertFrom-Json
          $statePath = 'docs/exec-plans/active/handoffs/laptop-trigger-state.json'
          $baseStatePath = Join-Path $env:RUNNER_TEMP 'producer-base-state-policy.json'
          $content = @(git show "$($env:BASE_SHA):$statePath")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read producer state from PR base.' }
          [IO.File]::WriteAllLines($baseStatePath, $content, [Text.UTF8Encoding]::new($false))
          $result = & $trustedEngine -Mode ValidateStatePr `
            -RequestPath ([string]$receipt.requestPath) `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -PolicyPath $trustedPolicy `
            -BaseStatePath $baseStatePath `
            -HeadStatePath $statePath `
            -ReceiptPath $receiptPath `
            -ChangedFilesJson (Join-Path $env:RUNNER_TEMP 'changed-files.json') `
            -BaseSha $env:BASE_SHA `
            -Json | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw "Producer handoff contract requires '$($result.status)' before merge." }
          $result | ConvertTo-Json -Compress

  pr-risk-serial-regression:
    name: PR risk serial regression
    needs: merge-policy-preflight
    if: needs.merge-policy-preflight.outputs.require-serial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run one-JVM risk regression
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Full -Ci
      - name: Upload risk serial reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-pr-risk-serial
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  merge-policy:
    name: Merge policy
    if: always() && github.event_name == 'pull_request'
    needs: [merge-policy-preflight, pr-risk-serial-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce merge policy and risk regression
        shell: pwsh
        env:
          PREFLIGHT_RESULT: ${{ needs.merge-policy-preflight.result }}
          SERIAL_REQUIRED: ${{ needs.merge-policy-preflight.outputs.require-serial }}
          SERIAL_RESULT: ${{ needs.pr-risk-serial-regression.result }}
        run: |
          if ($env:PREFLIGHT_RESULT -ne 'success') {
            throw "Merge policy preflight result: $env:PREFLIGHT_RESULT"
          }
          if ($env:SERIAL_REQUIRED -eq 'true' -and $env:SERIAL_RESULT -ne 'success') {
            throw "Required PR serial regression result: $env:SERIAL_RESULT"
          }
          if ($env:SERIAL_REQUIRED -ne 'true' -and $env:SERIAL_RESULT -notin @('skipped', 'success')) {
            throw "Unexpected optional PR serial regression result: $env:SERIAL_RESULT"
          }

  fast:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Inventory summary
        shell: pwsh
        run: ./scripts/test-inventory.ps1 -Mode Summary -ShardCount 3 -Json
      - name: Run fast lane
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Fast -Ci
      - name: Upload fast reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-fast
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run serial integration shard
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Integration -ShardCount 3 -ShardIndex ${{ matrix.shard }} -Ci
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-integration-${{ matrix.shard }}
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  automated-regression:
    name: Automated regression complete
    if: always()
    needs: [fast, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-*
          path: artifacts
      - name: Verify exact automated test coverage
        shell: pwsh
        run: ./scripts/test-inventory.ps1 -Mode VerifyReports -ReportRoots artifacts -Json
      - name: Enforce upstream job status
        if: needs.fast.result != 'success' || needs.integration.result != 'success'
        shell: pwsh
        run: throw 'Fast or integration test job failed.'

  main-serial-regression:
    name: Main serial regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run one-JVM automated regression
        shell: pwsh
        run: ./scripts/test.ps1 -Lane Full -Ci
      - name: Upload serial reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-main-serial
          path: target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14
